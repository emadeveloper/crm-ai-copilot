name: Keep API awake

# Render's free web service spins down after 15 min idle (cold start ~30-60s). This pings
# /health every 10 min so a recruiter's first click is fast. Set the repo variable
# API_URL to the deployed base URL (Settings → Secrets and variables → Actions → Variables).
#
# Note: GitHub pauses scheduled workflows after 60 days without repo activity — re-enable
# from the Actions tab if that happens.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          url="${{ vars.API_URL }}"
          if [ -z "$url" ]; then
            echo "API_URL repo variable not set — skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 90 "$url/health"
