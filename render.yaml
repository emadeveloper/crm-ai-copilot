# Render Blueprint — https://render.com/docs/blueprint-spec
# One free web service that serves the REST + GraphQL API and runs the pipeline worker
# in-process. The database is Neon (set DATABASE_URL to its pooled asyncpg connection string).

services:
  - type: web
    name: crm-ai-copilot-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # --- secrets: set in the Render dashboard, never commit ---
      - key: DATABASE_URL
        sync: false # Neon pooled URL, e.g. postgresql+asyncpg://user:pw@ep-xxx-pooler.neon.tech/db
      - key: GEMINI_API_KEY
        sync: false
      - key: HUBSPOT_PRIVATE_APP_TOKEN
        sync: false
      # --- tunables ---
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: LLM_RATE_PER_MIN
        value: "15"
      - key: MAX_TASK_ATTEMPTS
        value: "5"
      - key: WORKER_POLL_INTERVAL_SECONDS
        value: "2"
      - key: LOG_LEVEL
        value: INFO
