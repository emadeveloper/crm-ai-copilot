[project]
name = "crm-ai-copilot-api"
version = "0.1.0"
description = "CRM AI Copilot — hexagonal FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "strawberry-graphql[fastapi]>=0.251",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "google-genai>=1.0",
    "httpx>=0.28",
    "aiolimiter>=1.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-postgresql>=6.1",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "PL", "RUF"]
ignore = ["PLR2004"]

[tool.ruff.lint.pylint]
# Entity factories and use-case constructors take one keyword arg per real field.
max-args = 8

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]
"tests/*" = ["PLR0913"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["aiolimiter.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/worker.py"]  # thin `python -m app.worker` entrypoint; exercised by Phase 8 smoke

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]
